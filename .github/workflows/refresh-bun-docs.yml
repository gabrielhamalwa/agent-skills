name: refresh-bun-docs

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh Bun docs mirror
        run: bash bun/scripts/refresh-docs.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun/references
          git diff --cached --quiet || git commit -m "chore(bun): refresh docs mirror"
          git push
