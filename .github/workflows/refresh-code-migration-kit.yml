name: refresh-code-migration-kit

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh migration kit mirror
        run: bash code-migration/scripts/refresh-docs.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-migration/references/kit
          git diff --cached --quiet || git commit -m "chore(code-migration): refresh kit mirror"
          git push
