name: refresh-inertia-docs

on:
  schedule:
    - cron: "57 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh Inertia.js docs mirror
        run: bash inertia/scripts/refresh-docs.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inertia/references
          git diff --cached --quiet || git commit -m "chore(inertia): refresh docs mirror"
          git push
