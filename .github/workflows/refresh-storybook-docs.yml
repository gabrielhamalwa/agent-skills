name: refresh-storybook-docs

on:
  schedule:
    - cron: "22 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh Storybook docs mirror
        run: bash storybook/scripts/refresh-docs.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storybook/references
          git diff --cached --quiet || git commit -m "chore(storybook): refresh docs mirror"
          git push
