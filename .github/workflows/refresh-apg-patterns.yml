name: refresh-apg-patterns

on:
  schedule:
    - cron: "7 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Refresh APG patterns mirror
        run: bash accessibility-wcag/scripts/refresh-docs.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accessibility-wcag/references/apg
          git diff --cached --quiet || git commit -m "chore(accessibility-wcag): refresh APG patterns mirror"
          git push
